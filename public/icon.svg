<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1808"/>
      <stop offset="100%" stop-color="#080602"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ca8a04" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Cosmic Background -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" stroke="#ca8a04" stroke-width="1.5"/>
  
  <!-- Outer Celestial Orbit Rings -->
  <circle cx="32" cy="32" r="24" stroke="url(#ringGrad)" stroke-width="0.75" stroke-dasharray="2 3"/>
  <circle cx="32" cy="32" r="17" stroke="url(#ringGrad)" stroke-width="0.5" opacity="0.6"/>

  <!-- Celestial Coordinate Nodes -->
  <circle cx="32" cy="8" r="1.2" fill="#fef08a"/>
  <circle cx="56" cy="32" r="1.2" fill="#fef08a"/>
  <circle cx="32" cy="56" r="1.2" fill="#fef08a"/>
  <circle cx="8" cy="32" r="1.2" fill="#fef08a"/>

  <!-- Radiant 8-Pointed Vedic Astrological Star (Core) -->
  <g filter="url(#glow)">
    <!-- Primary 4-pointed Star -->
    <path d="M32 12 L35.2 27.8 L51 32 L35.2 36.2 L32 52 L28.8 36.2 L13 32 L28.8 27.8 Z" fill="url(#goldGrad)"/>
    <!-- Secondary Diagonal 4-pointed Star -->
    <path d="M32 19 L35.5 28.5 L45 32 L35.5 35.5 L32 45 L28.5 35.5 L19 32 L28.5 28.5 Z" fill="url(#goldGrad)" opacity="0.85" transform="rotate(45 32 32)"/>
    <!-- Center Sparkling Core -->
    <circle cx="32" cy="32" r="3.2" fill="#fffbeb"/>
    <circle cx="32" cy="32" r="1.5" fill="#ffffff"/>
  </g>
</svg>
