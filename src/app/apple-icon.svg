<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <radialGradient id="bgGlowApple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1808"/>
      <stop offset="100%" stop-color="#080602"/>
    </radialGradient>
    <linearGradient id="goldGradApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="ringGradApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ca8a04" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Circular Cosmic Background -->
  <rect width="180" height="180" rx="40" fill="#080602"/>
  <circle cx="90" cy="90" r="82" fill="url(#bgGlowApple)" stroke="#ca8a04" stroke-width="3"/>
  
  <!-- Outer Celestial Orbit Rings -->
  <circle cx="90" cy="90" r="66" stroke="url(#ringGradApple)" stroke-width="2" stroke-dasharray="6 8"/>
  <circle cx="90" cy="90" r="48" stroke="url(#ringGradApple)" stroke-width="1.5" opacity="0.6"/>

  <!-- Celestial Coordinate Nodes -->
  <circle cx="90" cy="24" r="3.5" fill="#fef08a"/>
  <circle cx="156" cy="90" r="3.5" fill="#fef08a"/>
  <circle cx="90" cy="156" r="3.5" fill="#fef08a"/>
  <circle cx="24" cy="90" r="3.5" fill="#fef08a"/>

  <!-- Radiant 8-Pointed Vedic Astrological Star (Core) -->
  <g>
    <!-- Primary 4-pointed Star -->
    <path d="M90 32 L99 78 L148 90 L99 102 L90 148 L81 102 L32 90 L81 78 Z" fill="url(#goldGradApple)"/>
    <!-- Secondary Diagonal 4-pointed Star -->
    <path d="M90 52 L100 80 L128 90 L100 100 L90 128 L80 100 L52 90 L80 80 Z" fill="url(#goldGradApple)" opacity="0.85" transform="rotate(45 90 90)"/>
    <!-- Center Sparkling Core -->
    <circle cx="90" cy="90" r="9" fill="#fffbeb"/>
    <circle cx="90" cy="90" r="4.5" fill="#ffffff"/>
  </g>
</svg>
